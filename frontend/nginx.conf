# nginx-Konfiguration für den Frontend-Container: ersetzt die Default-Config
# aus dem nginx:alpine-Image (siehe COPY im frontend/Dockerfile).
# Ohne die try_files-Zeile würde nginx bei einem direkten Aufruf von
# http://localhost:5173/admin (oder nach F5/Reload) die Datei
# "/usr/share/nginx/html/admin" suchen, nicht finden und 404 liefern.
# try_files $uri $uri/ /index.html;  = erst angefragte Datei suchen,
# dann ein gleichnamiges Verzeichnis, wenn beides fehlt: index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}